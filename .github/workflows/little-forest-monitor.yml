name: Little Forest public mention monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12 * * *'
permissions:
  contents: write
concurrency:
  group: little-forest-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public mentions with official NAVER API
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python gecko-monitor/scripts/collect.py
      - name: Commit public feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gecko-monitor/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Little Forest public mention feed"
            git push
          fi
