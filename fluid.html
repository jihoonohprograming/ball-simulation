<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>파도 공 1,000개</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#253965,#070b16 72%);font-family:system-ui,sans-serif;color:#f3f8ff}main{width:min(1000px,95vw);padding:22px 0}h1{text-align:center;margin:0;font-size:clamp(1.5rem,4vw,2.35rem)}p{text-align:center;color:#c0d3f3;margin:8px 0 16px}canvas{width:100%;height:min(67vh,620px);display:block;border:2px solid #70a7e6;border-radius:18px;background:linear-gradient(#aee5ff,#eafaff 64%,#c9eeff);box-shadow:0 18px 55px #0009}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:10px 16px;background:#417ee2;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}button:hover{background:#6097ee}.count{display:grid;place-items:center;padding:10px 15px;border-radius:10px;background:#ffffff16;color:#e4f2ff;font-weight:700}</style>
</head><body><main><h1>왼쪽에서 쏟아지는 파도 공 1,000개</h1><p>마찰 없음 · 튕김 100% · 고정된 중력</p><canvas id="world"></canvas><div class="controls"><button id="reset">처음부터 다시 쏟기</button><button id="pause">일시 정지</button><div class="count"><span id="count">0</span> / 1000</div></div></main>
<script>
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),R=4.1,D=R*2,CELL=D,N=1000,G=1550;
let W,H,ps=[],emitted=0,paused=false,last=performance.now(),carry=0;
function resize(){const b=canvas.getBoundingClientRect(),s=devicePixelRatio||1;canvas.width=b.width*s;canvas.height=b.height*s;ctx.setTransform(s,0,0,s,0,0);W=b.width;H=b.height}
addEventListener('resize',()=>{resize();reset()});resize();
function add(){const y=22+(Math.random()-.5)*9;ps.push({x:54+(Math.random()-.5)*10,y,vx:120+(Math.random()-.5)*70,vy:20+(Math.random()-.5)*30})}
function reset(){ps=[];const cols=24;for(let i=0;i<N;i++){const row=Math.floor(i/cols),col=i%cols;ps.push({x:47+col*D*.88+(Math.random()-.5),y:20+row*D*.88+(Math.random()-.5),vx:80+(Math.random()-.5)*30,vy:0})}emitted=N;carry=0;document.querySelector('#count').textContent=N}
function grid(){const m=new Map;for(let i=0;i<ps.length;i++){const p=ps[i],k=Math.floor(p.x/CELL)+','+Math.floor(p.y/CELL);let a=m.get(k);if(!a)m.set(k,a=[]);a.push(i)}return m}
function walls(p){if(p.x<R){p.x=R;p.vx=Math.abs(p.vx)}if(p.x>W-R){p.x=W-R;p.vx=-Math.abs(p.vx)}if(p.y<R){p.y=R;p.vy=Math.abs(p.vy)}if(p.y>H-R){p.y=H-R;p.vy=-Math.abs(p.vy)}}
function collisions(){const m=grid();for(let i=0;i<ps.length;i++){const a=ps[i],cx=Math.floor(a.x/CELL),cy=Math.floor(a.y/CELL);for(let yy=cy-1;yy<=cy+1;yy++)for(let xx=cx-1;xx<=cx+1;xx++){const list=m.get(xx+','+yy);if(!list)continue;for(const j of list){if(j<=i)continue;const b=ps[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2===0||d2>=D*D)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,overlap=(D-d)/2;a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,along=rvx*nx+rvy*ny;if(along<0){const impulse=-along;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}}}}
function step(dt){for(const p of ps){p.vy+=G*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;walls(p)}for(let k=0;k<2;k++){collisions();for(const p of ps)walls(p)}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#4f9f46';ctx.fillRect(0,H-7,W,7);ctx.fillStyle='#334d79';ctx.fillRect(21,0,64,16);ctx.fillStyle='#1c2d4f';ctx.fillRect(34,0,38,31);const shade=ctx.createRadialGradient(60,15,2,W*.55,H*.55,Math.max(W,H));shade.addColorStop(0,'#65d2ff');shade.addColorStop(1,'#087dcc');ctx.fillStyle=shade;for(const p of ps){ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ffffffb8';ctx.font='14px system-ui';ctx.fillText('마찰 0  ·  반발 100%  ·  중력 고정',16,52)}
function loop(t){const dt=Math.min((t-last)/1000,.025);last=t;if(!paused)step(dt);draw();requestAnimationFrame(loop)}
document.querySelector('#reset').onclick=reset;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'계속하기':'일시 정지'};requestAnimationFrame(loop);
</script></body></html>
