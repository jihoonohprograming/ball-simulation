<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 칸막이 공 파도</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#263962,#070b16 70%);font-family:system-ui,sans-serif;color:#f4f8ff;display:grid;place-items:center}main{width:min(1100px,96vw);padding:20px 0}h1{text-align:center;margin:0;font-size:clamp(1.45rem,4vw,2.3rem)}p{text-align:center;color:#c2d3f3;margin:8px 0 14px}#view{width:100%;height:min(68vh,650px);border:2px solid #6fa5e5;border-radius:18px;overflow:hidden;background:#a9e5ff;box-shadow:0 18px 55px #0009}.panel{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}.slider{display:flex;gap:10px;align-items:center;background:#ffffff14;padding:10px 14px;border-radius:11px;font-weight:700}.slider input{width:min(390px,55vw);accent-color:#75b6ff}button{border:0;border-radius:10px;background:#417ee2;color:#fff;padding:10px 16px;font-size:1rem;font-weight:700;cursor:pointer}button:hover{background:#6098ee}output{min-width:42px;text-align:right}</style></head>
<body><main><h1>3D 칸막이 파도 · 공 1,000개</h1><p>칸막이를 천천히 빼면 왼쪽 끝부터 열린 부분의 공이 먼저 아래로 떨어집니다.</p><div id="view"></div><div class="panel"><label class="slider">칸막이 빼기 <input id="gate" type="range" min="0" max="100" value="0"><output id="out">0%</output></label><button id="reset">칸막이 다시 닫기</button></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const holder=document.querySelector('#view'),gateInput=document.querySelector('#gate'),out=document.querySelector('#out'),N=1000,R=.145,D=R*2,G=15.5;
let W,H,scene,camera,renderer,balls,platform,divider,particles=[],last=performance.now(),drag=false,px=0,rot=.64;
const dummy=new THREE.Object3D(),color=new THREE.Color();
function setup(){scene=new THREE.Scene();scene.background=new THREE.Color('#a8e3ff');scene.fog=new THREE.Fog('#a8e3ff',12,29);camera=new THREE.PerspectiveCamera(44,1,.1,100);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));holder.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeafaff,0x315e41,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-6,10,8);scene.add(sun);const geo=new THREE.SphereGeometry(R,8,6),mat=new THREE.MeshStandardMaterial({roughness:.25,metalness:.05});balls=new THREE.InstancedMesh(geo,mat,N);balls.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(balls);const floor=new THREE.Mesh(new THREE.BoxGeometry(13.2,.25,4.2),new THREE.MeshStandardMaterial({color:0x477b48,roughness:.8}));floor.position.y=-3.7;scene.add(floor);const sides=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(13,.1,4)),new THREE.LineBasicMaterial({color:0x315c72}));sides.position.y=-3.53;scene.add(sides);platform=new THREE.Mesh(new THREE.BoxGeometry(12,.16,4),new THREE.MeshStandardMaterial({color:0x4d6f82,transparent:true,opacity:.78}));scene.add(platform);divider=new THREE.Mesh(new THREE.BoxGeometry(.16,2.5,4),new THREE.MeshStandardMaterial({color:0xff8d38,transparent:true,opacity:.72}));scene.add(divider);const rails=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(13,7,4)),new THREE.LineBasicMaterial({color:0x356982,transparent:true,opacity:.65}));rails.position.y=-.25;scene.add(rails);resize();reset()}
function resize(){const b=holder.getBoundingClientRect();W=b.width;H=b.height;renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
function reset(){particles=[];const nx=20,ny=10,nz=5;for(let n=0;n<N;n++){const ix=n%nx,iy=Math.floor(n/nx)%ny,iz=Math.floor(n/(nx*ny));particles.push({x:-5.7+ix*.6,y:2.4+iy*.31,z:-1.3+iz*.65,vx:0,vy:0,vz:0})}gateInput.value=0;updateGate()}
function updateGate(){const t=+gateInput.value/100,edge=-6+12*t;out.textContent=gateInput.value+'%';const remaining=12*(1-t);platform.scale.x=Math.max(.001,1-t);platform.position.set(edge+remaining/2,2.05,0);divider.position.set(edge,3.15,0)}
gateInput.oninput=updateGate;document.querySelector('#reset').onclick=reset;
function collide(){const map=new Map;for(let i=0;i<N;i++){const p=particles[i],key=Math.floor(p.x/D)+','+Math.floor(p.y/D)+','+Math.floor(p.z/D);let a=map.get(key);if(!a)map.set(key,a=[]);a.push(i)}for(let i=0;i<N;i++){const a=particles[i],cx=Math.floor(a.x/D),cy=Math.floor(a.y/D),cz=Math.floor(a.z/D);for(let zz=cz-1;zz<=cz+1;zz++)for(let yy=cy-1;yy<=cy+1;yy++)for(let xx=cx-1;xx<=cx+1;xx++){const list=map.get(xx+','+yy+','+zz);if(!list)continue;for(const j of list){if(j<=i)continue;const b=particles[j],dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,ds=dx*dx+dy*dy+dz*dz;if(ds===0||ds>=D*D)continue;const d=Math.sqrt(ds),nx=dx/d,ny=dy/d,nz=dz/d,over=(D-d)/2;a.x-=nx*over;a.y-=ny*over;a.z-=nz*over;b.x+=nx*over;b.y+=ny*over;b.z+=nz*over;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,rvz=b.vz-a.vz,v=rvx*nx+rvy*ny+rvz*nz;if(v<0){a.vx-=v*nx;a.vy-=v*ny;a.vz-=v*nz;b.vx+=v*nx;b.vy+=v*ny;b.vz+=v*nz}}}}}
function bounds(p){const edge=-6+12*(+gateInput.value/100);if(p.x<-6.35){p.x=-6.35;p.vx=Math.abs(p.vx)}if(p.x>6.35){p.x=6.35;p.vx=-Math.abs(p.vx)}if(p.z<-1.85){p.z=-1.85;p.vz=Math.abs(p.vz)}if(p.z>1.85){p.z=1.85;p.vz=-Math.abs(p.vz)}if(p.y<-3.45){p.y=-3.45;p.vy=Math.abs(p.vy)}if(p.y>5.8){p.y=5.8;p.vy=-Math.abs(p.vy)}if(p.y-R<2.05&&p.y>-.5&&p.x>edge){p.y=2.05+R;p.vy=Math.abs(p.vy)}}
function step(dt){for(const p of particles){p.vy-=G*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;bounds(p)}for(let n=0;n<2;n++){collide();for(const p of particles)bounds(p)}}
function draw(){for(let i=0;i<N;i++){const p=particles[i];dummy.position.set(p.x,p.y,p.z);dummy.updateMatrix();balls.setMatrixAt(i,dummy.matrix);color.setHSL(.54+(p.y+3.5)*.012,.82,.53);balls.setColorAt(i,color)}balls.instanceMatrix.needsUpdate=true;balls.instanceColor.needsUpdate=true;camera.position.set(11*Math.sin(rot),5.5,11*Math.cos(rot));camera.lookAt(0,.2,0);renderer.render(scene,camera)}
function loop(t){const dt=Math.min((t-last)/1000,.02);last=t;step(dt);draw();requestAnimationFrame(loop)}
holder.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;holder.setPointerCapture(e.pointerId)});holder.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-px)*.008;px=e.clientX}});holder.addEventListener('pointerup',()=>drag=false);setup();requestAnimationFrame(loop);
</script></body></html>
