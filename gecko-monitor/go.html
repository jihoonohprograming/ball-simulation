<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작은숲속 도마뱀마을 링크 이동</title><script src="analytics-config.js"></script><body style="font:16px system-ui;background:#f4f8f4;color:#214c35;display:grid;place-items:center;min-height:90vh"><main style="background:white;max-width:430px;padding:25px;border-radius:16px"><h2>🦎 작은숲속 도마뱀마을</h2><p id="desc">이동 주소 확인 중</p><button id="move" disabled style="background:#205b46;color:white;padding:12px 25px;border:0;border-radius:9px">채널로 이동</button><p style="font-size:12px;color:#687e71">이 페이지는 링크 추적을 위한 중간 이동 페이지입니다.</p></main><script>
const p=new URLSearchParams(location.search),to=p.get('to'),channel=p.get('channel'),allowed={'밴드':['band.us'],'스마트스토어':['smartstore.naver.com','brand.naver.com'],'블로그':['blog.naver.com','m.blog.naver.com'],'카카오톡 채팅방':['open.kakao.com','pf.kakao.com']};let ok=false;try{const u=new URL(to);ok=u.protocol==='https:'&&allowed[channel]?.includes(u.hostname)&&!u.username&&!u.password}catch{};const b=document.getElementById('move');if(ok){document.getElementById('desc').textContent=channel+'으로 이동합니다.';b.disabled=false}else document.getElementById('desc').textContent='지원하지 않는 주소입니다.';const id=window.LITTLEFOREST_GA4_ID||'';if(ok&&/^G-[A-Z0-9]{6,15}$/.test(id)){const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+id;document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date);gtag('config',id,{send_page_view:false})};b.onclick=()=>{if(!ok)return;if(typeof gtag==='function'){gtag('event','outbound_channel_click',{destination_channel:channel,traffic_source:p.get('utm_source'),traffic_campaign:p.get('utm_campaign'),event_callback:()=>location.replace(to),event_timeout:650});setTimeout(()=>location.replace(to),750)}else location.replace(to)}
</script></body></html>
