<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입자 유체 칸막이 실험</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#294878,#09111e 70%);font-family:system-ui,sans-serif;color:#f3f9ff}main{width:min(1080px,96vw);padding:20px 0}h1{text-align:center;margin:0;font-size:clamp(1.45rem,4vw,2.3rem)}p{text-align:center;color:#c2d7f5;margin:8px 0 14px}canvas{display:block;width:100%;height:min(67vh,640px);border:2px solid #70a7e6;border-radius:18px;background:linear-gradient(#b7eaff,#eafaff 67%,#7ec66c);box-shadow:0 18px 55px #0009;touch-action:none}.controls{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}.gate{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;background:#ffffff15;font-weight:700}.gate input{width:min(400px,55vw);accent-color:#77b9ff}button{border:0;border-radius:10px;padding:10px 16px;background:#417ee2;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}button:hover{background:#6099ee}output{min-width:42px;text-align:right}</style></head>
<body><main><h1>칸막이 유체 모방 실험</h1><p>5,200개 유체 입자의 압력·점성·응집 흐름을 관찰해 보세요.</p><canvas id="world"></canvas><div class="controls"><input id="lift" type="hidden" value="0"><button id="openGate">칸막이 한 번에 빼기</button><button id="reset">실험 다시 시작</button></div></main>
<script>
const c=document.querySelector('#world'),ctx=c.getContext('2d'),lift=document.querySelector('#lift');
const N=5200,R=2.1,H=10.5,GRAVITY=1050,REST=.10,VISC=.055;
let W,Ht,bottom,gateX,particles=[],last=performance.now(),acc=0;
function resize(){const b=c.getBoundingClientRect(),s=devicePixelRatio||1;c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);ctx.setTransform(s,0,0,s,0,0);W=b.width;Ht=b.height;bottom=Ht-42;gateX=W*.37;reset()}addEventListener('resize',resize);
function reset(){particles=[];const spacing=R*1.82,cols=Math.floor((gateX-70)/spacing),rows=Math.ceil(N/cols);for(let n=0;n<N;n++){const col=n%cols,row=Math.floor(n/cols);const jitter=(Math.random()-.5)*R*.34;particles.push({x:58+col*spacing+jitter,y:bottom-R-row*spacing+(Math.random()-.5)*R*.34,vx:0,vy:0})}lift.value=0}
function buildGrid(){const map=new Map;for(let i=0;i<N;i++){const p=particles[i],cx=Math.floor(p.x/H),cy=Math.floor(p.y/H),k=cx+','+cy;let a=map.get(k);if(!a)map.set(k,a=[]);a.push(i)}return map}
function contain(p){const left=34,right=W-34,top=30;if(p.x-R<left){p.x=left+R;p.vx=Math.abs(p.vx)*REST}if(p.x+R>right){p.x=right-R;p.vx=-Math.abs(p.vx)*REST}if(p.y-R<top){p.y=top+R;p.vy=Math.abs(p.vy)*REST}if(p.y+R>bottom){p.y=bottom-R;p.vy=-Math.abs(p.vy)*REST}const gap=+lift.value/100*(bottom-top-28),gateBottom=bottom-gap;if(p.y-R<gateBottom&&Math.abs(p.x-gateX)<R*1.25){if(p.x<gateX){p.x=gateX-R*1.25;p.vx=-Math.abs(p.vx)*REST}else{p.x=gateX+R*1.25;p.vx=Math.abs(p.vx)*REST}}}
function fluidSolve(dt){for(const p of particles){p.vy+=GRAVITY*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;contain(p)}for(let pass=0;pass<2;pass++){const grid=buildGrid();for(let i=0;i<N;i++){const a=particles[i],cx=Math.floor(a.x/H),cy=Math.floor(a.y/H);for(let yy=cy-1;yy<=cy+1;yy++)for(let xx=cx-1;xx<=cx+1;xx++){const list=grid.get(xx+','+yy);if(!list)continue;for(const j of list){if(j<=i)continue;const b=particles[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(!d2||d2>H*H)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,q=1-d/H;const push=q*q*1.12;const ox=nx*push,oy=ny*push;a.x-=ox;a.y-=oy;b.x+=ox;b.y+=oy;const blend=VISC*q;const dvx=(b.vx-a.vx)*blend,dvy=(b.vy-a.vy)*blend;a.vx+=dvx;a.vy+=dvy;b.vx-=dvx;b.vy-=dvy}}}for(const p of particles)contain(p)}}
function step(dt){if(+lift.value===0)return;fluidSolve(dt)}
function drawTank(){const top=30,left=34,right=W-34,gap=+lift.value/100*(bottom-top-28),gb=bottom-gap;ctx.fillStyle='#ffffff3b';ctx.fillRect(left,top,right-left,bottom-top);ctx.strokeStyle='#2a6681';ctx.lineWidth=3;ctx.strokeRect(left,top,right-left,bottom-top);ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left+35,top-20);ctx.lineTo(right+35,top-20);ctx.lineTo(right,top);ctx.stroke();ctx.beginPath();ctx.moveTo(right,top);ctx.lineTo(right+35,top-20);ctx.lineTo(right+35,bottom-20);ctx.lineTo(right,bottom);ctx.stroke();ctx.fillStyle='#ed8735cc';ctx.beginPath();ctx.moveTo(gateX-10,top);ctx.lineTo(gateX+10,top);ctx.lineTo(gateX+10,gb);ctx.lineTo(gateX-10,gb+20);ctx.closePath();ctx.fill();ctx.strokeStyle='#9d4518';ctx.stroke();ctx.fillStyle='#ffffffc9';ctx.font='14px system-ui';ctx.fillText('유체 입자: 5,200개',left+14,top+23)}
function draw(){ctx.clearRect(0,0,W,Ht);drawTank();ctx.fillStyle='#129bd4';ctx.beginPath();for(const p of particles)ctx.arc(p.x,p.y,R*1.18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9f8ff99';ctx.beginPath();for(let i=0;i<N;i+=4){const p=particles[i];ctx.arc(p.x-R*.28,p.y-R*.3,R*.22,0,Math.PI*2)}ctx.fill()}
function loop(t){const dt=Math.min((t-last)/1000,.025);last=t;acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60}draw();requestAnimationFrame(loop)}
document.querySelector('#openGate').onclick=()=>{lift.value=100};document.querySelector('#reset').onclick=reset;resize();requestAnimationFrame(loop);
</script></body></html>
