<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공의 이동 시뮬레이션</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#243b66,#0b1020 68%);color:#f4f7ff;font-family:system-ui,sans-serif}main{width:min(920px,94vw);padding:24px 0}h1{margin:0 0 8px;text-align:center;font-size:clamp(1.55rem,4vw,2.35rem)}.help{margin:0 0 18px;color:#b8c7e8;text-align:center}canvas{display:block;width:100%;height:min(58vh,520px);border:2px solid #5f85ca;border-radius:18px;background:linear-gradient(#9ad8ff 0%,#d9f3ff 68%,#8ed17a 68%,#6eb45f 100%);touch-action:none;box-shadow:0 14px 45px #0008}.panel{margin-top:15px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:#4c7de1;color:#fff;font-size:1rem;font-weight:700}button:hover{background:#6593ec}label{display:flex;align-items:center;gap:8px;color:#dce7ff}input{accent-color:#75a5ff}output{display:inline-block;min-width:32px}</style></head><body><main><h1>공의 이동 시뮬레이션</h1><p class="help">공을 드래그해서 던져 보세요 · 방향키로 힘을 줄 수 있어요</p><canvas id="world"></canvas><div class="panel"><button id="pause">일시 정지</button><button id="reset">처음 위치</button><label>중력 <input id="gravity" type="range" min="100" max="1800" value="850" step="50"><output id="gravityOut">850</output></label><label>튕김 <input id="bounce" type="range" min="20" max="98" value="76"><output id="bounceOut">76%</output></label></div></main><script>const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),pause=document.querySelector('#pause'),gravityInput=document.querySelector('#gravity'),bounceInput=document.querySelector('#bounce'),gravityOut=document.querySelector('#gravityOut'),bounceOut=document.querySelector('#bounceOut');let w,h,running=true,last=performance.now(),dragging=false,dragStart,pointer;const ball={x:170,y:90,vx:210,vy:0,r:27};function resize(){const r=canvas.getBoundingClientRect(),s=devicePixelRatio||1;canvas.width=Math.round(r.width*s);canvas.height=Math.round(r.height*s);ctx.setTransform(s,0,0,s,0,0);w=r.width;h=r.height;ball.x=Math.min(ball.x,w-ball.r);ball.y=Math.min(ball.y,h-ball.r)}addEventListener('resize',resize);resize();function reset(){ball.x=Math.min(170,w/2);ball.y=90;ball.vx=210;ball.vy=0}function position(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{const p=position(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<=ball.r+12){dragging=true;dragStart=p;pointer=p;ball.vx=ball.vy=0;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(dragging)pointer=position(e)});canvas.addEventListener('pointerup',e=>{if(!dragging)return;const p=position(e);ball.vx=(dragStart.x-p.x)*4;ball.vy=(dragStart.y-p.y)*4;dragging=false;canvas.releasePointerCapture(e.pointerId)});addEventListener('keydown',e=>{const p=95;if(e.key==='ArrowLeft')ball.vx-=p;if(e.key==='ArrowRight')ball.vx+=p;if(e.key==='ArrowUp')ball.vy-=p*1.6;if(e.key==='ArrowDown')ball.vy+=p});pause.onclick=()=>{running=!running;pause.textContent=running?'일시 정지':'계속하기'};document.querySelector('#reset').onclick=reset;function update(dt){if(!running||dragging)return;const g=+gravityInput.value,b=+bounceInput.value/100;ball.vy+=g*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*b}if(ball.x+ball.r>w){ball.x=w-ball.r;ball.vx=-Math.abs(ball.vx)*b}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*b}if(ball.y+ball.r>h){ball.y=h-ball.r;ball.vy=-Math.abs(ball.vy)*b;ball.vx*=.992;if(Math.abs(ball.vy)<20)ball.vy=0}}function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#ffffff45';for(let i=0;i<w;i+=48)ctx.fillRect(i,h*.68,25,3);if(dragging){ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(pointer.x,pointer.y);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.stroke();ctx.setLineDash([])}const s=ctx.createRadialGradient(ball.x-9,ball.y-11,3,ball.x,ball.y,ball.r);s.addColorStop(0,'#fff8b5');s.addColorStop(.45,'#ffbd36');s.addColorStop(1,'#d85b12');ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle=s;ctx.fill();ctx.strokeStyle='#9a3b10';ctx.lineWidth=2;ctx.stroke()}function loop(now){const dt=Math.min((now-last)/1000,.03);last=now;gravityOut.textContent=gravityInput.value;bounceOut.textContent=bounceInput.value+'%';update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);</script></body></html>
