<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입자 유체 칸막이 실험</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#294878,#09111e 70%);font-family:system-ui,sans-serif;color:#f3f9ff}main{width:min(1080px,96vw);padding:20px 0}h1{text-align:center;margin:0;font-size:clamp(1.45rem,4vw,2.3rem)}p{text-align:center;color:#c2d7f5;margin:8px 0 14px}canvas{display:block;width:100%;height:min(67vh,640px);border:2px solid #70a7e6;border-radius:18px;background:linear-gradient(#b7eaff,#eafaff 67%,#7ec66c);box-shadow:0 18px 55px #0009;touch-action:none}.controls{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}.gate{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;background:#ffffff15;font-weight:700}.gate input{width:min(400px,55vw);accent-color:#77b9ff}button{border:0;border-radius:10px;padding:10px 16px;background:#417ee2;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}button:hover{background:#6099ee}output{min-width:42px;text-align:right}</style></head>
<body><main><h1>3D 칸막이 유체 모방 실험</h1><p>5,200개 유체 입자의 압력·점성·응집 흐름을 관찰해 보세요.</p><canvas id="world"></canvas><div class="controls"><input id="lift" type="hidden" value="0"><button id="openGate">칸막이 한 번에 빼기</button><button id="reset">실험 다시 시작</button></div></main>
<script>
const c=document.querySelector('#world'),ctx=c.getContext('2d'),lift=document.querySelector('#lift');
const N=2600,R=5,H=25,GRAVITY=1050,REST=.36,XREST=.92,VISC=0;
let W,Ht,bottom,gateX,particles=[],last=performance.now(),acc=0,yaw=.55,dragging=false,lastX=0,wavePhase=0,waveEnergy=0;
function resize(){const b=c.getBoundingClientRect(),s=devicePixelRatio||1;c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);ctx.setTransform(s,0,0,s,0,0);W=b.width;Ht=b.height;bottom=Ht-42;gateX=W*.68;reset()}addEventListener('resize',resize);
function reset(){particles=[];const spacing=R*1.82,cols=Math.floor((gateX-70)/spacing),rows=Math.ceil(N/cols);for(let n=0;n<N;n++){const col=n%cols,row=Math.floor(n/cols);const jitter=(Math.random()-.5)*R*.34;particles.push({x:58+col*spacing+jitter,y:bottom-R-row*spacing+(Math.random()-.5)*R*.34,vx:0,vy:0,z:(Math.random()-.5)*70})}lift.value=0;waveEnergy=0}
function buildGrid(){const map=new Map;for(let i=0;i<N;i++){const p=particles[i],cx=Math.floor(p.x/H),cy=Math.floor(p.y/H),k=cx+','+cy;let a=map.get(k);if(!a)map.set(k,a=[]);a.push(i)}return map}
function contain(p){const left=34,right=W-34,top=30;if(p.x-R<left){p.x=left+R;p.vx=Math.abs(p.vx)*XREST}if(p.x+R>right){p.x=right-R;p.vx=-Math.abs(p.vx)*XREST}if(p.y-R<top){p.y=top+R;p.vy=Math.abs(p.vy)*REST}if(p.y+R>bottom){p.y=bottom-R;p.vy=-Math.abs(p.vy)*REST}const gap=+lift.value/100*(bottom-top-28),gateBottom=bottom-gap;if(p.y-R<gateBottom&&Math.abs(p.x-gateX)<R*1.25){if(p.x<gateX){p.x=gateX-R*1.25;p.vx=-Math.abs(p.vx)*REST}else{p.x=gateX+R*1.25;p.vx=Math.abs(p.vx)*REST}}}
function fluidSolve(dt){wavePhase+=dt*4.2;waveEnergy*=.997;for(const p of particles){const surface=.3+.7*Math.max(0,1-(bottom-p.y)/600);p.vy+=(GRAVITY+Math.cos(p.x*.035-wavePhase)*85*surface*waveEnergy)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;contain(p)}for(let pass=0;pass<2;pass++){const grid=buildGrid();for(let i=0;i<N;i++){const a=particles[i],cx=Math.floor(a.x/H),cy=Math.floor(a.y/H);for(let yy=cy-1;yy<=cy+1;yy++)for(let xx=cx-1;xx<=cx+1;xx++){const list=grid.get(xx+','+yy);if(!list)continue;for(const j of list){if(j<=i)continue;const b=particles[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(!d2||d2>H*H)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,q=1-d/H;const push=q*q*1.12;const ox=nx*push,oy=ny*push;a.x-=ox;a.y-=oy;b.x+=ox;b.y+=oy;const blend=VISC*q;const dvx=(b.vx-a.vx)*blend,dvy=(b.vy-a.vy)*blend;a.vx+=dvx;a.vy+=dvy;b.vx-=dvx;b.vy-=dvy}}}for(const p of particles)contain(p)}}
function step(dt){if(+lift.value===0)return;fluidSolve(dt)}
function Q(px,py,pz){const cx=W/2,cy=Ht*.54,co=Math.cos(yaw),si=Math.sin(yaw),X=px-cx,rx=X*co-pz*si,rz=X*si+pz*co,d=1+rz/1050;return{x:cx+rx/d,y:cy+(py-cy)/d,z:rz,scale:1/d}}
function face(v,fill,stroke){ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);for(let i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawTank(){const t=30,l=34,r=W-34,b=bottom,d=95,gap=+lift.value/100*(b-t-28),gb=b-gap;const v=[[l,t,-d],[r,t,-d],[r,b,-d],[l,b,-d],[l,t,d],[r,t,d],[r,b,d],[l,b,d]].map(p=>Q(...p));face([v[4],v[5],v[6],v[7]],'#ffffff1a','#2a6681');face([v[0],v[1],v[5],v[4]],'#ffffff28','#2a6681');face([v[1],v[2],v[6],v[5]],'#ffffff22','#2a6681');face([v[2],v[3],v[7],v[6]],'#4c9b492c','#2a6681');ctx.strokeStyle='#2a6681';ctx.lineWidth=2.5;for(const e of [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]){ctx.beginPath();ctx.moveTo(v[e[0]].x,v[e[0]].y);ctx.lineTo(v[e[1]].x,v[e[1]].y);ctx.stroke()}const gate=[Q(gateX-10,t,-d),Q(gateX+10,t,-d),Q(gateX+10,gb,d),Q(gateX-10,gb,d)];face(gate,'#ed8735bb','#9d4518');const label=Q(l+15,t+26,-d);ctx.fillStyle='#ffffffd9';ctx.font='14px system-ui';ctx.fillText('유체 입자: 2,600개',label.x,label.y)}
function draw(){ctx.clearRect(0,0,W,Ht);drawTank();const ordered=particles.slice().sort((a,b)=>(a.z*Math.sin(yaw))-(b.z*Math.sin(yaw)));for(let i=0;i<N;i++){const p=ordered[i],q=Q(p.x,p.y,p.z),rr=R*q.scale;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,Math.PI*2);ctx.fillStyle='#129bd4';ctx.fill();if(i%5===0){ctx.beginPath();ctx.arc(q.x-rr*.24,q.y-rr*.25,rr*.25,0,Math.PI*2);ctx.fillStyle='#d9f8ff99';ctx.fill()}}}
function loop(t){const dt=Math.min((t-last)/1000,.025);last=t;acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60}draw();requestAnimationFrame(loop)}
document.querySelector('#openGate').onclick=()=>{lift.value=100;waveEnergy=1.6;for(const p of particles){p.vx=2940*(.88+Math.random()*.24);p.vy+=(Math.random()-.5)*90}};document.querySelector('#reset').onclick=reset;c.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(dragging){yaw+=(e.clientX-lastX)*.012;lastX=e.clientX}});c.addEventListener('pointerup',()=>dragging=false);resize();requestAnimationFrame(loop);
</script></body></html>
