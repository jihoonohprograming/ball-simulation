<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 칸막이 공 파도</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#263962,#070b16 70%);font-family:system-ui,sans-serif;color:#f4f8ff;display:grid;place-items:center}main{width:min(1100px,96vw);padding:20px 0}h1{text-align:center;margin:0;font-size:clamp(1.45rem,4vw,2.3rem)}p{text-align:center;color:#c2d3f3;margin:8px 0 14px}canvas{width:100%;height:min(68vh,650px);display:block;border:2px solid #6fa5e5;border-radius:18px;background:linear-gradient(#9bdbff,#e8faff 68%,#9cda85);box-shadow:0 18px 55px #0009;touch-action:none}.panel{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}.slider{display:flex;gap:10px;align-items:center;background:#ffffff14;padding:10px 14px;border-radius:11px;font-weight:700}.slider input{width:min(390px,55vw);accent-color:#75b6ff}button{border:0;border-radius:10px;background:#417ee2;color:#fff;padding:10px 16px;font-size:1rem;font-weight:700;cursor:pointer}button:hover{background:#6098ee}output{min-width:42px;text-align:right}</style></head>
<body><main><h1>3D 유체 파도 · 공 100,000개</h1><p>칸막이를 천천히 빼면 왼쪽 끝부터 열린 부분의 공이 먼저 아래로 떨어집니다. 화면을 드래그하면 시점이 돌아갑니다.</p><canvas id="world"></canvas><div class="panel"><label class="slider">칸막이 빼기 <input id="gate" type="range" min="0" max="100" value="0"><output id="out">0%</output></label><button id="reset">칸막이 다시 닫기</button></div></main>
<script>
const c=document.querySelector('#world'),x=c.getContext('2d'),gate=document.querySelector('#gate'),out=document.querySelector('#out'),TOTAL=100000,N=1000,R=.06,D=R*2,G=15.5;
let W,H,ps=[],last=performance.now(),rot=.72,drag=false,oldX=0;
function resize(){const b=c.getBoundingClientRect(),s=devicePixelRatio||1;c.width=b.width*s;c.height=b.height*s;x.setTransform(s,0,0,s,0,0);W=b.width;H=b.height}addEventListener('resize',resize);resize();
function reset(){ps=[];for(let n=0;n<N;n++){const px=-5.95+Math.random()*11.8;const plane=px;const py=plane+R+Math.random()*Math.max(.03,6.15-plane-R);ps.push({x:px,y:py,z:(Math.random()-.5)*11.8,vx:0,vy:0,vz:0})}gate.value=0;showGate()}
function showGate(){out.textContent=gate.value+'%'}gate.oninput=showGate;document.querySelector('#reset').onclick=reset;
function map(){const m=new Map;for(let i=0;i<N;i++){const p=ps[i],k=Math.floor(p.x/D)+','+Math.floor(p.y/D)+','+Math.floor(p.z/D);let a=m.get(k);if(!a)m.set(k,a=[]);a.push(i)}return m}
function collide(){const m=map();for(let i=0;i<N;i++){const a=ps[i],cx=Math.floor(a.x/D),cy=Math.floor(a.y/D),cz=Math.floor(a.z/D);for(let zz=cz-1;zz<=cz+1;zz++)for(let yy=cy-1;yy<=cy+1;yy++)for(let xx=cx-1;xx<=cx+1;xx++){const a2=m.get(xx+','+yy+','+zz);if(!a2)continue;for(const j of a2){if(j<=i)continue;const b=ps[j],dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d2=dx*dx+dy*dy+dz*dz;if(!d2||d2>=D*D)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,nz=dz/d,o=(D-d)/2;a.x-=nx*o;a.y-=ny*o;a.z-=nz*o;b.x+=nx*o;b.y+=ny*o;b.z+=nz*o;const v=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny+(b.vz-a.vz)*nz;if(v<0){const j=.525*v;a.vx+=j*nx;a.vy+=j*ny;a.vz+=j*nz;b.vx-=j*nx;b.vy-=j*ny;b.vz-=j*nz}}}}}
function bound(p){const edge=-6+12*(+gate.value/100);if(p.x<-6.35){p.x=-6.35;p.vx=Math.abs(p.vx)*.05}if(p.x>6.35){p.x=6.35;p.vx=-Math.abs(p.vx)*.05}if(p.z<-6.35){p.z=-6.35;p.vz=Math.abs(p.vz)*.05}if(p.z>6.35){p.z=6.35;p.vz=-Math.abs(p.vz)*.05}if(p.y<-6.35){p.y=-6.35;p.vy=Math.abs(p.vy)*.03}if(p.y>8){p.y=8;p.vy=-Math.abs(p.vy)*.03}const slope=-6+(p.x-edge);if(p.x>=edge&&p.x<=6&&p.y-R<slope&&p.y>slope-.7){p.y=slope+R;p.vy=Math.abs(p.vy)*.03}}
function step(dt){if(+gate.value===0)return;for(const p of ps){p.vx*=.94;p.vy=p.vy*.94-G*dt;p.vz*=.94;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;bound(p)}for(let q=0;q<2;q++){collide();for(const p of ps)bound(p)}}
function P(X,Y,Z){X*=.15;Y*=.15;Z*=.15;const co=Math.cos(rot),si=Math.sin(rot),rx=co*X-si*Z,rz=si*X+co*Z,d=3.2+rz,s=430/d;return{x:W/2+rx*s,y:H*.61-Y*s,z:d,r:R*s*1.55}}
function poly(a,fill,stroke){x.beginPath();x.moveTo(a[0].x,a[0].y);for(let i=1;i<a.length;i++)x.lineTo(a[i].x,a[i].y);x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.stroke()}}
function box(x1,x2,y1,y2,z1,z2,fill){const q=[[x1,y1,z1],[x2,y1,z1],[x2,y1,z2],[x1,y1,z2],[x1,y2,z1],[x2,y2,z1],[x2,y2,z2],[x1,y2,z2]].map(v=>P(...v));poly([q[0],q[1],q[2],q[3]],fill,'#275c73');poly([q[0],q[1],q[5],q[4]],fill,'#275c73');poly([q[1],q[2],q[6],q[5]],fill,'#275c73')}
function wireCube(){const v=[[-6.5,-6.5,-6.5],[6.5,-6.5,-6.5],[6.5,-6.5,6.5],[-6.5,-6.5,6.5],[-6.5,6.5,-6.5],[6.5,6.5,-6.5],[6.5,6.5,6.5],[-6.5,6.5,6.5]].map(a=>P(...a));const e=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];x.strokeStyle='#2b637c';x.lineWidth=2;for(const a of e){x.beginPath();x.moveTo(v[a[0]].x,v[a[0]].y);x.lineTo(v[a[1]].x,v[a[1]].y);x.stroke()}}
function draw(){x.clearRect(0,0,W,H);const edge=-6+12*(+gate.value/100);box(-6.5,6.5,-6.58,-6.35,-6.5,6.5,'#4a8a46');if(edge<6)box(edge,6,1.96,2.12,-6.5,6.5,'#5e8293cc');
box(-6.5,-6.28,-3.55,8,-6.5,6.5,'#587c8c88');box(6.28,6.5,-3.55,8,-6.5,6.5,'#587c8c88');box(-6.5,6.5,-3.55,5.8,-2,-1.78,'#587c8c55');box(-6.5,6.5,-3.55,5.8,1.78,2,'#587c8c55');
poly([P(edge,-6,-6.5),P(6,-edge,-6.5),P(6,-edge,6.5),P(edge,-6,6.5)],'#ff913bcc','#a44916');const pts=ps.map(p=>({p,q:P(p.x,p.y,p.z)})).sort((a,b)=>b.q.z-a.q.z);for(const o of pts){const q=o.q,g=x.createRadialGradient(q.x-q.r*.35,q.y-q.r*.4,q.r*.12,q.x,q.y,q.r);g.addColorStop(0,'#d5f7ff');g.addColorStop(.35,'#48c8ff');g.addColorStop(1,'#0872bd');x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fillStyle=g;x.fill()}x.fillStyle='#ffffffcc';x.font='14px system-ui';x.fillText('100,000개 유체 입자 · 낮은 반발 · 높은 점성',16,26)}
function loop(t){const dt=Math.min((t-last)/1000,.02);last=t;step(dt);draw();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{drag=true;oldX=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-oldX)*.008;oldX=e.clientX}});c.addEventListener('pointerup',()=>drag=false);reset();requestAnimationFrame(loop);
</script></body></html>
